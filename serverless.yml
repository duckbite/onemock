service: onemock-api

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs22.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  memorySize: 512
  timeout: 30
  environment:
    NODE_ENV: ${self:provider.stage}
    AWS_REGION: ${self:provider.region}
    JWT_SECRET: ${env:JWT_SECRET}
    OPENAI_API_KEY: ${env:OPENAI_API_KEY}
    REDIS_URL: ${env:REDIS_URL}
    ALLOWED_ORIGINS: ${env:ALLOWED_ORIGINS, '*'}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - arn:aws:dynamodb:${self:provider.region}:*:table/Services
            - arn:aws:dynamodb:${self:provider.region}:*:table/Users
            - arn:aws:dynamodb:${self:provider.region}:*:table/Requests
            - arn:aws:dynamodb:${self:provider.region}:*:table/Templates
            - arn:aws:dynamodb:${self:provider.region}:*:table/Services/index/*
            - arn:aws:dynamodb:${self:provider.region}:*:table/Users/index/*
            - arn:aws:dynamodb:${self:provider.region}:*:table/Requests/index/*
            - arn:aws:dynamodb:${self:provider.region}:*:table/Templates/index/*
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
          Resource:
            - arn:aws:s3:::onemock-${self:provider.stage}-schemas/*
            - arn:aws:s3:::onemock-${self:provider.stage}-templates/*

plugins:
  - serverless-plugin-typescript
  - serverless-offline

custom:
  serverless-offline:
    httpPort: 3000
    host: 0.0.0.0

functions:
  api:
    handler: src/main.handler
    events:
      - http:
          path: /{proxy+}
          method: ANY
          cors:
            origin: ${env:ALLOWED_ORIGINS, '*'}
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: false
      - http:
          path: /
          method: ANY
          cors:
            origin: ${env:ALLOWED_ORIGINS, '*'}
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: false

resources:
  Resources:
    # DynamoDB Tables
    ServicesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: Services
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: serviceId
            AttributeType: S
          - AttributeName: serviceName
            AttributeType: S
        KeySchema:
          - AttributeName: serviceId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: serviceName-index
            KeySchema:
              - AttributeName: serviceName
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: Users
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: userId
            AttributeType: S
          - AttributeName: apiKey
            AttributeType: S
        KeySchema:
          - AttributeName: userId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: apiKey-index
            KeySchema:
              - AttributeName: apiKey
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    RequestsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: Requests
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: requestId
            AttributeType: S
          - AttributeName: userId
            AttributeType: S
          - AttributeName: timestamp
            AttributeType: S
        KeySchema:
          - AttributeName: requestId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: userId-timestamp-index
            KeySchema:
              - AttributeName: userId
                KeyType: HASH
              - AttributeName: timestamp
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    TemplatesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: Templates
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: templateId
            AttributeType: S
          - AttributeName: serviceName
            AttributeType: S
        KeySchema:
          - AttributeName: templateId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: serviceName-index
            KeySchema:
              - AttributeName: serviceName
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    # S3 Buckets
    SchemasBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: onemock-${self:provider.stage}-schemas
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true

    TemplatesBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: onemock-${self:provider.stage}-templates
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true

  Outputs:
    ApiGatewayRestApiId:
      Value:
        Ref: ApiGatewayRestApi
      Export:
        Name: ${self:service}-${self:provider.stage}-restApiId

    ApiGatewayRestApiRootResourceId:
      Value:
        Fn::GetAtt:
          - ApiGatewayRestApi
          - RootResourceId
      Export:
        Name: ${self:service}-${self:provider.stage}-rootResourceId
